<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UOB IT PMO Kanban</title>
<style>
/* ==========================================================================
   Design tokens — palette, spacing, type
   ========================================================================== */
:root {
  --c-primary: #0b3d91;
  --c-primary-dark: #072a66;
  --c-primary-light: #e8effb;
  --c-bg: #f3f5f9;
  --c-surface: #ffffff;
  --c-border: #d6dce6;
  --c-text: #1c2533;
  --c-text-muted: #5b6678;
  --c-focus: #ffb81c;

  --c-critical: #c62828;
  --c-high: #d98200;
  --c-medium: #1e63d6;
  --c-low: #8a94a6;

  --c-danger: #b3261e;
  --c-danger-bg: #fdecea;
  --c-success: #1b7a43;
  --c-success-bg: #e6f4ec;
  --c-warning: #8a5a00;
  --c-warning-bg: #fff4dc;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;

  --radius-sm: 4px;
  --radius: 8px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.08);
  --shadow: 0 4px 16px rgba(16, 24, 40, 0.14);

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--c-text);
  background: var(--c-bg);
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 3px solid var(--c-focus);
  outline-offset: 2px;
}

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ==========================================================================
   Buttons
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: var(--space-2) var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  font-weight: 600;
  cursor: pointer;
  background: var(--c-surface);
  border-color: var(--c-border);
}
.btn:hover { background: var(--c-primary-light); }
.btn-primary { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.btn-primary:hover { background: var(--c-primary-dark); }
.btn-accent { background: #fff; color: var(--c-primary); border-color: #fff; }
.btn-accent:hover { background: var(--c-primary-light); }
.btn:disabled { opacity: 0.6; cursor: progress; }

/* ==========================================================================
   Header, wordmark, summary strip
   ========================================================================== */
.app-header {
  background: var(--c-primary);
  color: #fff;
  padding: var(--space-4) var(--space-5);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-4);
}
.wordmark {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 0.02em;
}
.wordmark span { font-weight: 400; opacity: 0.85; }
.demo-note { margin: var(--space-1) 0 0; font-size: 12px; opacity: 0.85; }

.summary {
  list-style: none;
  margin: 0 0 0 auto;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}
.summary li {
  background: rgba(255, 255, 255, 0.12);
  border-radius: var(--radius-sm);
  padding: var(--space-1) var(--space-3);
  font-size: 12px;
  text-align: center;
  min-width: 72px;
}
.summary strong { display: block; font-size: 18px; line-height: 1.2; }
.summary .is-overdue { background: rgba(198, 40, 40, 0.55); }

/* ==========================================================================
   Filter bar
   ========================================================================== */
main { padding: var(--space-5); }

.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-4);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius);
  padding: var(--space-3) var(--space-4);
  margin-bottom: var(--space-5);
}
.filters h2 { font-size: 14px; margin: 0; align-self: center; color: var(--c-text-muted); }
.filter-field { display: flex; flex-direction: column; gap: var(--space-1); }
.filter-field label { font-size: 12px; font-weight: 600; color: var(--c-text-muted); }
.filter-field select,
.filter-field input {
  padding: 6px var(--space-2);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: #fff;
  min-width: 180px;
}

/* ==========================================================================
   Board & columns
   ========================================================================== */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--space-4);
  align-items: start;
}
.column {
  background: #e7ebf2;
  border: 2px solid transparent;
  border-radius: var(--radius);
  padding: var(--space-3);
  min-height: 320px;
  transition: background 0.15s, border-color 0.15s;
}
.column.drag-over {
  background: var(--c-primary-light);
  border: 2px dashed var(--c-primary);
}
.column-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.column-header h2 { margin: 0; font-size: 15px; }
.count-badge {
  background: var(--c-primary);
  color: #fff;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
  padding: 2px var(--space-2);
  min-width: 24px;
  text-align: center;
}
.card-list { display: flex; flex-direction: column; gap: var(--space-3); min-height: 60px; }
.empty { color: var(--c-text-muted); font-size: 13px; text-align: center; padding: var(--space-4) 0; margin: 0; }

/* ==========================================================================
   Task card
   ========================================================================== */
.card {
  background: var(--c-surface);
  border-radius: var(--radius-sm);
  border-left: 5px solid var(--c-low);
  box-shadow: var(--shadow-sm);
  padding: var(--space-3);
  cursor: grab;
}
.card.dragging { opacity: 0.45; }
.card.prio-critical { border-left-color: var(--c-critical); }
.card.prio-high { border-left-color: var(--c-high); }
.card.prio-medium { border-left-color: var(--c-medium); }
.card.prio-low { border-left-color: var(--c-low); }

.card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.task-id { font-size: 11px; font-weight: 700; color: var(--c-text-muted); letter-spacing: 0.03em; }
.card-title { margin: var(--space-1) 0 var(--space-2); font-size: 14px; font-weight: 600; word-wrap: break-word; }
.card-meta { margin: 0; font-size: 12px; color: var(--c-text-muted); display: grid; gap: 2px; }
.card-meta dt { display: inline; font-weight: 600; }
.card-meta dd { display: inline; margin: 0; }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--space-1); margin-top: var(--space-2); }

.pill {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  padding: 1px var(--space-2);
  border-radius: 999px;
  color: #fff;
}
.pill-critical { background: var(--c-critical); }
.pill-high { background: var(--c-high); color: #2b1a00; }
.pill-medium { background: var(--c-medium); }
.pill-low { background: var(--c-low); color: #1c2533; }
.tag {
  font-size: 11px;
  padding: 1px var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--c-primary-light);
  color: var(--c-primary-dark);
}
.badge-overdue {
  font-size: 11px;
  font-weight: 700;
  padding: 1px var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--c-danger-bg);
  color: var(--c-danger);
  border: 1px solid #f3b8b3;
}

.card-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid #edf0f5;
}
.move-select {
  font-size: 12px;
  padding: 2px var(--space-1);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: #fff;
  cursor: pointer;
}
.icon-btn {
  border: none;
  background: transparent;
  font-size: 18px;
  line-height: 1;
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  color: var(--c-text-muted);
  cursor: pointer;
}
.icon-btn:hover { background: var(--c-danger-bg); color: var(--c-danger); }
.confirm-delete { display: flex; align-items: center; gap: var(--space-1); font-size: 12px; font-weight: 600; color: var(--c-danger); }
.confirm-delete button {
  font-size: 12px;
  padding: 2px var(--space-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--c-border);
  background: #fff;
  cursor: pointer;
}
.confirm-delete .yes { background: var(--c-danger); border-color: var(--c-danger); color: #fff; }

/* ==========================================================================
   Modal & form
   ========================================================================== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(10, 20, 40, 0.5);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--space-6) var(--space-4);
  overflow-y: auto;
  z-index: 10;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--c-surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  width: 100%;
  max-width: 560px;
  padding: var(--space-5);
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
.modal-header h2 { margin: 0; font-size: 18px; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-4); }
.form-field { display: flex; flex-direction: column; gap: var(--space-1); }
.form-field.full { grid-column: 1 / -1; }
.form-field label { font-weight: 600; font-size: 13px; }
.req { color: var(--c-danger); }
.form-field input,
.form-field select,
.form-field textarea {
  padding: var(--space-2);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: #fff;
}
.form-field textarea { resize: vertical; min-height: 80px; }
.form-field [aria-invalid="true"] { border-color: var(--c-danger); background: #fffafa; }
.field-error { margin: 0; min-height: 1em; font-size: 12px; color: var(--c-danger); }
.char-count { font-size: 11px; color: var(--c-text-muted); align-self: flex-end; }
.form-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-5); }

/* ==========================================================================
   Toasts
   ========================================================================== */
.toasts {
  position: fixed;
  right: var(--space-4);
  bottom: var(--space-4);
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  z-index: 20;
  max-width: calc(100vw - 2 * var(--space-4));
}
.toast {
  background: var(--c-surface);
  border-left: 5px solid var(--c-primary);
  box-shadow: var(--shadow);
  border-radius: var(--radius-sm);
  padding: var(--space-3) var(--space-4);
  min-width: 260px;
  animation: toast-in 0.2s ease-out;
}
.toast-success { border-left-color: var(--c-success); background: var(--c-success-bg); }
.toast-warning { border-left-color: var(--c-high); background: var(--c-warning-bg); color: var(--c-warning); }
.toast-error { border-left-color: var(--c-danger); background: var(--c-danger-bg); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ==========================================================================
   Responsive & motion
   ========================================================================== */
@media (max-width: 767px) {
  .app-header { padding: var(--space-4); }
  .summary { margin-left: 0; }
  main { padding: var(--space-4); }
  .board { grid-template-columns: 1fr; }
  .column { min-height: 0; }
  .filter-field { flex: 1 1 100%; }
  .filter-field select, .filter-field input { min-width: 0; width: 100%; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .column, .toast { transition: none; animation: none; }
}
</style>
</head>
<body>

<!-- ========================================================================
     Header: wordmark, live summary, add button
     ======================================================================== -->
<header class="app-header">
  <div>
    <h1 class="wordmark">UOB IT PMO <span>· Kanban</span></h1>
    <p class="demo-note">Demo mode: tasks are kept in memory only, so refreshing the page resets the board to its sample data.</p>
  </div>
  <ul class="summary" id="summary" aria-label="Board summary"></ul>
  <button type="button" class="btn btn-accent" id="open-add-task">+ Add Task</button>
</header>

<main>
  <!-- ======================================================================
       Filter bar
       ====================================================================== -->
  <section class="filters" aria-labelledby="filters-heading">
    <h2 id="filters-heading">Filter</h2>
    <div class="filter-field">
      <label for="filter-project">Project</label>
      <select id="filter-project"><option value="">All projects</option></select>
    </div>
    <div class="filter-field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="search" id="filter-assignee" placeholder="e.g. Tan">
    </div>
    <div class="filter-field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority"><option value="">All priorities</option></select>
    </div>
    <button type="button" class="btn" id="clear-filters">Clear filters</button>
  </section>

  <!-- ======================================================================
       Kanban board (columns are built by renderBoard())
       ====================================================================== -->
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- ========================================================================
     Add Task modal
     ======================================================================== -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-header">
      <h2 id="modal-title">Add Task</h2>
      <button type="button" class="icon-btn" id="close-modal" aria-label="Close add task dialog">×</button>
    </div>
    <form id="task-form" novalidate>
      <div class="form-grid">
        <div class="form-field full">
          <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="f-title-error f-title-count">
          <span class="char-count" id="f-title-count">0 / 80</span>
          <p class="field-error" id="f-title-error"></p>
        </div>
        <div class="form-field full">
          <label for="f-description">Description</label>
          <textarea id="f-description" name="description" maxlength="500" aria-describedby="f-description-error f-description-count"></textarea>
          <span class="char-count" id="f-description-count">0 / 500</span>
          <p class="field-error" id="f-description-error"></p>
        </div>
        <div class="form-field">
          <label for="f-project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
          <select id="f-project" name="project" required aria-describedby="f-project-error"></select>
          <p class="field-error" id="f-project-error"></p>
        </div>
        <div class="form-field">
          <label for="f-category">Category <span class="req" aria-hidden="true">*</span></label>
          <select id="f-category" name="category" required aria-describedby="f-category-error"></select>
          <p class="field-error" id="f-category-error"></p>
        </div>
        <div class="form-field">
          <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="f-assignee" name="assignee" maxlength="60" required aria-describedby="f-assignee-error">
          <p class="field-error" id="f-assignee-error"></p>
        </div>
        <div class="form-field">
          <label for="f-priority">Priority</label>
          <select id="f-priority" name="priority" aria-describedby="f-priority-error"></select>
          <p class="field-error" id="f-priority-error"></p>
        </div>
        <div class="form-field">
          <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
          <input type="date" id="f-dueDate" name="dueDate" required aria-describedby="f-dueDate-error">
          <p class="field-error" id="f-dueDate-error"></p>
        </div>
        <div class="form-field">
          <label for="f-status">Status</label>
          <select id="f-status" name="status" aria-describedby="f-status-error"></select>
          <p class="field-error" id="f-status-error"></p>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="cancel-modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-task">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast region (announced politely to screen readers) -->
<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<!--
  FormSubmit configuration
  ------------------------
  FORMSUBMIT_ENDPOINT (top of the script below) holds the email address that
  receives new-task notifications. FormSubmit needs a ONE-TIME ACTIVATION:
  the first submission to a new address sends a confirmation email to that
  address. Notifications are only delivered after someone clicks the
  activation link in that email.
-->
<script>
"use strict";

/* ==========================================================================
   CONFIG: change the email address here (the only place it appears)
   ========================================================================== */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";

/* ==========================================================================
   Reference data
   ========================================================================== */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed",
};
const PROJECTS = [
  "Core Banking Upgrade",
  "Digital Channels",
  "Cybersecurity Uplift",
  "Data & Analytics",
  "Infrastructure & Cloud",
  "Vendor Management",
];
const CATEGORIES = [
  "Application Development",
  "Infrastructure",
  "Cybersecurity",
  "Data",
  "Compliance",
  "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* ==========================================================================
   State: the single source of truth (in memory only)
   ========================================================================== */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
  pendingDeleteId: null, // card currently showing the inline "Delete? Yes / No"
};
let nextIdNumber = 1;
let sendingCount = 0;

/* ==========================================================================
   Helpers
   ========================================================================== */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Local-date ISO string (YYYY-MM-DD), not UTC, so "today" matches the user's calendar
function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function todayISO() { return toISODate(new Date()); }
function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

function formatId(n) { return `UOB-ITPM-${String(n).padStart(4, "0")}`; }

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function slug(text) { return text.toLowerCase().replace(/[^a-z0-9]+/g, "-"); }

function optionsHtml(values, selected) {
  return values
    .map((v) => `<option value="${escapeHtml(v)}"${v === selected ? " selected" : ""}>${escapeHtml(v)}</option>`)
    .join("");
}

/* ==========================================================================
   Seed data: 8 demo tasks, with due dates relative to today
   ========================================================================== */
function seedTasks() {
  const seeds = [
    { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift FX pricing engine to AWS ap-southeast-1 with active-passive DR.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Tan Wei Ming", priority: "High", dueDate: addDays(12), status: "In Progress" },
    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix to all branch teller VDI golden images and redeploy.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Priya Nair", priority: "Critical", dueDate: addDays(-3), status: "Blocked" },
    { title: "UAT sign-off for mobile onboarding release 4.2", description: "Collect business UAT sign-off for eKYC and new account onboarding flows.", project: "Digital Channels", category: "Application Development", assignee: "Lim Jia Hui", priority: "High", dueDate: addDays(5), status: "In Progress" },
    { title: "Renew core banking vendor support contract", description: "Negotiate 3-year renewal of premium support; confirm SLA credits.", project: "Vendor Management", category: "Vendor", assignee: "Ahmad Faizal", priority: "Medium", dueDate: addDays(30), status: "Backlog" },
    { title: "Build TRM control evidence dashboard", description: "Consolidate technology risk control evidence for the annual audit cycle.", project: "Data & Analytics", category: "Compliance", assignee: "Chen Li Ting", priority: "Medium", dueDate: addDays(21), status: "Backlog" },
    { title: "Decommission legacy SFTP gateway", description: "Migrate remaining partner feeds to managed file transfer and retire host.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Rajesh Kumar", priority: "Low", dueDate: addDays(-10), status: "Done" },
    { title: "Rotate HSM keys for card payments", description: "Awaiting change-board approval for key ceremony window.", project: "Core Banking Upgrade", category: "Cybersecurity", assignee: "Tan Wei Ming", priority: "Critical", dueDate: addDays(2), status: "Blocked" },
    { title: "Data lineage catalogue for regulatory reporting", description: "Document lineage for liquidity reporting data marts.", project: "Data & Analytics", category: "Data", assignee: "Nur Aisyah", priority: "Low", dueDate: addDays(-1), status: "Backlog" },
  ];
  state.tasks = seeds.map((s) => ({ id: formatId(nextIdNumber++), ...s }));
}

/* ==========================================================================
   Filtering
   ========================================================================== */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter((t) =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* ==========================================================================
   Rendering: everything on the board is rebuilt from state here
   ========================================================================== */
function renderCard(task) {
  const p = task.priority.toLowerCase();
  const id = escapeHtml(task.id);
  const moveOptions = STATUSES
    .filter((s) => s !== task.status)
    .map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`)
    .join("");

  const deleteControl = state.pendingDeleteId === task.id
    ? `<span class="confirm-delete" role="group" aria-label="Confirm delete ${id}">
         Delete?
         <button type="button" class="yes" data-action="confirm-delete" data-id="${id}">Yes</button>
         <button type="button" data-action="cancel-delete" data-id="${id}">No</button>
       </span>`
    : `<button type="button" class="icon-btn" data-action="delete" data-id="${id}" aria-label="Delete task ${id}">×</button>`;

  return `
    <article class="card prio-${p}" draggable="true" data-id="${id}" aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="task-id">${id}</span>
        <span class="pill pill-${p}">${escapeHtml(task.priority)}</span>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <dl class="card-meta">
        <div><dt>Project:</dt> <dd>${escapeHtml(task.project)}</dd></div>
        <div><dt>Assignee:</dt> <dd>${escapeHtml(task.assignee)}</dd></div>
        <div><dt>Due:</dt> <dd>${escapeHtml(formatDate(task.dueDate))}</dd></div>
      </dl>
      <div class="card-tags">
        <span class="tag">${escapeHtml(task.category)}</span>
        ${isOverdue(task) ? '<span class="badge-overdue">Overdue</span>' : ""}
      </div>
      <div class="card-actions">
        <select class="move-select" data-id="${id}" aria-label="Move task ${id} to another column">
          <option value="" selected>Move ▸</option>
          ${moveOptions}
        </select>
        ${deleteControl}
      </div>
    </article>`;
}

function renderSummary() {
  const counts = Object.fromEntries(STATUSES.map((s) => [s, 0]));
  state.tasks.forEach((t) => { counts[t.status] += 1; });
  const overdue = state.tasks.filter(isOverdue).length;
  const items = [["Total", state.tasks.length], ...STATUSES.map((s) => [s, counts[s]])];
  document.getElementById("summary").innerHTML =
    items.map(([label, n]) => `<li><strong>${n}</strong>${escapeHtml(label)}</li>`).join("") +
    `<li class="is-overdue"><strong>${overdue}</strong>Overdue</li>`;
}

function renderBoard() {
  const visible = applyFilters(state.tasks);
  const board = document.getElementById("board");
  board.innerHTML = STATUSES.map((status) => {
    const tasks = visible.filter((t) => t.status === status);
    const key = slug(status);
    return `
      <section class="column" data-status="${escapeHtml(status)}" aria-labelledby="col-${key}">
        <div class="column-header">
          <h2 id="col-${key}" tabindex="-1" title="${escapeHtml(STATUS_HINTS[status])}">${escapeHtml(status)}</h2>
          <span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span>
        </div>
        <div class="card-list">
          ${tasks.length ? tasks.map(renderCard).join("") : '<p class="empty">No tasks</p>'}
        </div>
      </section>`;
  }).join("");
  renderSummary();
}

/* ==========================================================================
   Focus management after a re-render (keeps keyboard users oriented)
   ========================================================================== */
function focusAfterRender(selector, fallbackStatus) {
  const el = document.querySelector(selector);
  if (el) { el.focus(); return; }
  if (fallbackStatus) {
    const heading = document.getElementById(`col-${slug(fallbackStatus)}`);
    if (heading) heading.focus();
  }
}

/* ==========================================================================
   Mutations: change state, then re-render
   ========================================================================== */
function addTask(data) {
  const task = { id: formatId(nextIdNumber++), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task || !STATUSES.includes(newStatus) || task.status === newStatus) return false;
  task.status = newStatus;
  state.pendingDeleteId = null;
  renderBoard();
  return true;
}

function deleteTask(id) {
  const task = state.tasks.find((t) => t.id === id);
  state.tasks = state.tasks.filter((t) => t.id !== id);
  state.pendingDeleteId = null;
  renderBoard();
  return task;
}

/* ==========================================================================
   Toasts
   ========================================================================== */
function showToast(message, type = "success", timeout = 4500) {
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.setAttribute("role", type === "success" ? "status" : "alert");
  toast.textContent = message;
  document.getElementById("toasts").appendChild(toast);
  setTimeout(() => toast.remove(), timeout);
}

/* ==========================================================================
   FormSubmit notification (AJAX JSON endpoint, never navigates away)
   ========================================================================== */
async function notifyNewTask(task) {
  if (FORMSUBMIT_ENDPOINT.includes("YOUR_EMAIL@example.com")) {
    throw new Error("FormSubmit endpoint not configured: set FORMSUBMIT_ENDPOINT");
  }
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  return res.json();
}

/* ==========================================================================
   Add Task form: validation, modal, submit
   ========================================================================== */
const form = document.getElementById("task-form");
const modalBackdrop = document.getElementById("modal-backdrop");
const submitBtn = document.getElementById("submit-task");
let lastFocusBeforeModal = null;

function populateFormOptions() {
  document.getElementById("f-project").innerHTML =
    '<option value="">Select a project…</option>' + optionsHtml(PROJECTS);
  document.getElementById("f-category").innerHTML =
    '<option value="">Select a category…</option>' + optionsHtml(CATEGORIES);
  document.getElementById("f-priority").innerHTML = optionsHtml(PRIORITIES, "Medium");
  document.getElementById("f-status").innerHTML = optionsHtml(STATUSES, "Backlog");
  document.getElementById("filter-project").innerHTML += optionsHtml(PROJECTS);
  document.getElementById("filter-priority").innerHTML += optionsHtml(PRIORITIES);
}

function readForm() {
  const v = (name) => form.elements[name].value;
  return {
    title: v("title").trim(),
    description: v("description").trim(),
    project: v("project"),
    category: v("category"),
    assignee: v("assignee").trim(),
    priority: v("priority"),
    dueDate: v("dueDate"),
    status: v("status"),
  };
}

function setFieldError(name, message) {
  const input = document.getElementById(`f-${name}`);
  document.getElementById(`f-${name}-error`).textContent = message;
  if (message) input.setAttribute("aria-invalid", "true");
  else input.removeAttribute("aria-invalid");
}

function validateForm(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Please choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Please choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Please choose a priority.";
  if (!STATUSES.includes(data.status)) errors.status = "Please choose a status.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Please enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"]
    .forEach((name) => setFieldError(name, errors[name] || ""));
  return errors;
}

function updateCharCount(name, max) {
  const len = form.elements[name].value.length;
  document.getElementById(`f-${name}-count`).textContent = `${len} / ${max}`;
}

function resetForm() {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"]
    .forEach((name) => setFieldError(name, ""));
  updateCharCount("title", 80);
  updateCharCount("description", 500);
}

function setSending(isSending) {
  submitBtn.disabled = isSending;
  submitBtn.textContent = isSending ? "Sending…" : "Add Task";
}

function openModal() {
  lastFocusBeforeModal = document.activeElement;
  form.elements.dueDate.min = todayISO();
  modalBackdrop.hidden = false;
  document.getElementById("f-title").focus();
}

function closeModal() {
  modalBackdrop.hidden = true;
  if (lastFocusBeforeModal) lastFocusBeforeModal.focus();
}

async function handleSubmit(event) {
  event.preventDefault();
  if (sendingCount > 0) return;
  const data = readForm();
  const errors = validateForm(data);
  const firstInvalid = Object.keys(errors)[0];
  if (firstInvalid) {
    document.getElementById(`f-${firstInvalid}`).focus();
    return;
  }

  // Optimistic UI: the card appears straight away and the email goes out in parallel
  const task = addTask(data);
  resetForm();
  showToast(`${task.id} added to ${task.status}.`, "success");

  sendingCount += 1;
  setSending(true);
  try {
    await notifyNewTask(task);
  } catch (err) {
    console.warn("[UOB IT PMO] Notification failed:", err);
    showToast("Card added locally — email notification failed", "warning", 6000);
  } finally {
    sendingCount -= 1;
    setSending(sendingCount > 0);
  }
}

/* ==========================================================================
   Event wiring
   ========================================================================== */
function wireBoardEvents() {
  const board = document.getElementById("board");
  let draggedId = null;

  // Native HTML5 drag and drop
  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    draggedId = card.dataset.id;
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", draggedId);
    card.classList.add("dragging");
  });

  board.addEventListener("dragover", (e) => {
    const column = e.target.closest(".column");
    if (!column || !draggedId) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    board.querySelectorAll(".column.drag-over").forEach((c) => { if (c !== column) c.classList.remove("drag-over"); });
    column.classList.add("drag-over");
  });

  board.addEventListener("dragleave", (e) => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("drag-over");
  });

  board.addEventListener("drop", (e) => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    const id = e.dataTransfer.getData("text/plain") || draggedId;
    draggedId = null;
    if (moveTask(id, column.dataset.status)) {
      showToast(`${id} moved to ${column.dataset.status}.`, "success", 2500);
    } else {
      renderBoard();
    }
  });

  board.addEventListener("dragend", () => {
    draggedId = null;
    board.querySelectorAll(".drag-over, .dragging").forEach((el) => el.classList.remove("drag-over", "dragging"));
  });

  // Keyboard-accessible "Move ▸" fallback
  board.addEventListener("change", (e) => {
    const select = e.target.closest(".move-select");
    if (!select || !select.value) return;
    const id = select.dataset.id;
    const target = select.value;
    if (moveTask(id, target)) {
      showToast(`${id} moved to ${target}.`, "success", 2500);
      focusAfterRender(`.move-select[data-id="${CSS.escape(id)}"]`, target);
    }
  });

  // Inline delete confirmation
  board.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const sel = (action) => `button[data-action="${action}"][data-id="${CSS.escape(id)}"]`;

    if (btn.dataset.action === "delete") {
      state.pendingDeleteId = id;
      renderBoard();
      focusAfterRender(sel("cancel-delete"));
    } else if (btn.dataset.action === "cancel-delete") {
      state.pendingDeleteId = null;
      renderBoard();
      focusAfterRender(sel("delete"));
    } else if (btn.dataset.action === "confirm-delete") {
      const removed = deleteTask(id);
      if (removed) {
        showToast(`${id} deleted.`, "success", 2500);
        focusAfterRender(null, removed.status);
      }
    }
  });

  // Escape cancels a pending delete
  board.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && state.pendingDeleteId) {
      const id = state.pendingDeleteId;
      state.pendingDeleteId = null;
      renderBoard();
      focusAfterRender(`button[data-action="delete"][data-id="${CSS.escape(id)}"]`);
    }
  });
}

function wireFilterEvents() {
  const project = document.getElementById("filter-project");
  const assignee = document.getElementById("filter-assignee");
  const priority = document.getElementById("filter-priority");
  const update = () => {
    state.filters = { project: project.value, assignee: assignee.value, priority: priority.value };
    renderBoard();
  };
  project.addEventListener("change", update);
  priority.addEventListener("change", update);
  assignee.addEventListener("input", update);
  document.getElementById("clear-filters").addEventListener("click", () => {
    project.value = "";
    assignee.value = "";
    priority.value = "";
    update();
  });
}

function wireModalEvents() {
  document.getElementById("open-add-task").addEventListener("click", openModal);
  document.getElementById("close-modal").addEventListener("click", closeModal);
  document.getElementById("cancel-modal").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => { if (e.target === modalBackdrop) closeModal(); });

  // Esc closes; Tab is trapped inside the dialog
  modalBackdrop.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { closeModal(); return; }
    if (e.key !== "Tab") return;
    const focusables = [...modalBackdrop.querySelectorAll("button, input, select, textarea")].filter((el) => !el.disabled);
    const first = focusables[0];
    const last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  form.addEventListener("submit", handleSubmit);
  form.elements.title.addEventListener("input", () => updateCharCount("title", 80));
  form.elements.description.addEventListener("input", () => updateCharCount("description", 500));
}

/* ==========================================================================
   Init
   ========================================================================== */
function init() {
  populateFormOptions();
  seedTasks();
  wireBoardEvents();
  wireFilterEvents();
  wireModalEvents();
  renderBoard();
}

init();
</script>
